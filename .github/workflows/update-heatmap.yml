name: Update Cavriana Heatmap
# The authority data names every letter, so it must never reach the front end
# before the letter's own page does. Both workflows used to fire on the same
# push and merely took turns, so this one could push a reference to a page that
# did not exist yet and fail its own smoke test. It now waits for the
# conversion to finish instead.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Convert XML to Markdown"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - "scripts/**.py"
      - "templates/CustomHeatmap.template.jsx"
      - "assets/cavriana-heatmap-custom.css"
jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    # Nothing to publish if the conversion itself failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Serialize pushes to the frontend repo with convert-xml-to-markdown.yml
    concurrency:
      group: frontend-push
    steps:
    # ── 1  Back-end: fetch repo and build component ───────────────
    - uses: actions/checkout@v4        # CavrianaCorr
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate letter metadata → CSV
      working-directory: scripts
      run: python letter_parser.py
    # generate_custom_heatmap.py expects repo-root, writes to generated/
    - name: Generate CustomHeatmap.jsx
      run: python scripts/generate_custom_heatmap.py
    - name: Build authority dataset (entity links, people/places indexes)
      run: python scripts/build_authorities.py
    # ── 2  Front-end: check out site repo ─────────────────────────
    - uses: actions/checkout@v4
      with:
        repository: Pantagrueliste/CavrianaCorr_FrontEnd
        path: CavrianaCorr_FrontEnd
        token: ${{ secrets.DOCUSAURUS_REPO_SECRET }}
    - name: Copy component and stylesheet into front-end repo
      run: |
        mkdir -p CavrianaCorr_FrontEnd/src/components CavrianaCorr_FrontEnd/src/css \
                 CavrianaCorr_FrontEnd/src/data CavrianaCorr_FrontEnd/static
        cp generated/CustomHeatmap.jsx \
           CavrianaCorr_FrontEnd/src/components/
        cp assets/cavriana-heatmap-custom.css \
           CavrianaCorr_FrontEnd/src/css/
        cp generated/authorities.json \
           CavrianaCorr_FrontEnd/src/data/
        # the table of identifiers the indexes offer for download
        cp generated/authorities.csv \
           CavrianaCorr_FrontEnd/static/
    # ── 3  Smoke-build the Docusaurus site ───────────────────────
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install JS dependencies
      working-directory: CavrianaCorr_FrontEnd
      run: npm ci
    - name: Build site (smoke-test)
      working-directory: CavrianaCorr_FrontEnd
      run: npm run build
    # ── 4  Commit & push component if build succeeded ────────────
    - name: Commit and push component
      if: ${{ success() }}
      working-directory: CavrianaCorr_FrontEnd
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add src/components/CustomHeatmap.jsx src/css/cavriana-heatmap-custom.css \
                src/data/authorities.json static/authorities.csv
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update heat-map and authority data"
          git stash --include-untracked
          for i in 1 2 3; do
            git pull --rebase origin main && \
            git push origin main && break || sleep 5
          done
        fi

    # The generated data is committed here too, so that the copy in this
    # repository matches what the site is built from. It used to be produced
    # only inside the runner, so generated/ drifted silently out of date and
    # anyone reading it — including the editor — saw stale counts.
    - name: Commit regenerated data back to this repository
      if: ${{ success() }}
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add generated/authorities.json generated/authorities.csv generated/CustomHeatmap.jsx
        if ! git diff --cached --quiet; then
          git commit -m "Regenerate authority data"
          for i in 1 2 3; do
            git pull --rebase origin main && \
            git push origin main && break || sleep 5
          done
        fi
